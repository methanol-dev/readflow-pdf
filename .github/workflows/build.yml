name: Build ReadFlow Multiplatform (Android & iOS)

on:
  push:
    branches: [ main, v3-flutter ]
    tags: [ 'v3*' ]
  pull_request:
    branches: [ main, v3-flutter ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Copy and rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ReadFlow-v3.0.0-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadFlow-v3.0.0-Android-APK
          path: ReadFlow-v3.0.0-Android.apk

  build-ios:
    name: Build iOS IPA (No-Codesign for Sideloading)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App without codesign
        run: flutter build ios --no-codesign --release

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ReadFlow-v3.0.0-iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadFlow-v3.0.0-iOS-IPA
          path: ReadFlow-v3.0.0-iOS.ipa

  publish-release:
    name: Publish GitHub Release (on tag)
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v3')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: ReadFlow-v3.0.0-Android-APK

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ReadFlow-v3.0.0-iOS-IPA

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ReadFlow-v3.0.0-Android.apk
            ReadFlow-v3.0.0-iOS.ipa
          name: ReadFlow ${{ github.ref_name }} - Multiplatform (Android & iOS)
          body: |
            ## 📱 ReadFlow ${{ github.ref_name }} (Flutter Multiplatform)
            Phiên bản đa nền tảng hoàn toàn mới hỗ trợ cả Android và iOS:
            - **Android (`.apk`)**: Tải `ReadFlow-v3.0.0-Android.apk` và cài đặt trực tiếp.
            - **iOS (`.ipa`)**: Tải `ReadFlow-v3.0.0-iOS.ipa` và cài đặt lên iPhone bằng Sideloadly hoặc AltStore.
          draft: false
          prerelease: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
